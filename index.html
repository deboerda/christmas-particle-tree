<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>电子颗粒圣诞树 🎄</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #000; overflow: hidden; }
  #info {
    position: absolute;
    left: 24px;
    top: 42%;
    color: #fff;
    font-family: system-ui, sans-serif;
    font-size: 20px;
    letter-spacing: 1px;
    text-shadow: 0 0 12px #ff99cc, 0 0 4px #fff;
    pointer-events: none;
    z-index: 10;
  }
  #info span { display: block; font-size: 15px; opacity: 0.75; margin-top: 6px; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="info">Merry Christmas<br><span>647</span></div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H * 0.55;
}
resize();
window.addEventListener('resize', resize);

// Tree particles
const treeParticles = [];
const treeCount = 6000;
for (let i = 0; i < treeCount; i++) {
  const t = i / treeCount;
  const height = (1 - t) * 420;
  const radius = t * 160 + 8;
  const angle = t * Math.PI * 14 + Math.random() * 0.4;
  treeParticles.push({
    angle,
    radius: radius * (0.6 + Math.random() * 0.7),
    height,
    speed: 0.008 + Math.random() * 0.004,
    size: 1.2 + Math.random() * 1.8,
    hue: 320 + Math.random() * 40,
    sat: 70 + Math.random() * 30,
    light: 70 + Math.random() * 25
  });
}

// Snow
const snow = [];
const snowCount = 1800;
for (let i = 0; i < snowCount; i++) {
  snow.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: 0.6 + Math.random() * 1.8,
    speed: 0.4 + Math.random() * 1.2,
    drift: Math.random() * 0.4 - 0.2
  });
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // Draw tree
  ctx.save();
  ctx.translate(cx, cy);
  for (const p of treeParticles) {
    p.angle += p.speed;
    const x = Math.cos(p.angle) * p.radius;
    const y = -p.height;
    const alpha = 0.6 + Math.sin(p.angle * 2) * 0.3;
    ctx.beginPath();
    ctx.fillStyle = `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${alpha})`;
    ctx.arc(x, y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  // Star
  ctx.fillStyle = '#ffe6ff';
  ctx.shadowColor = '#ff99cc';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.arc(0, -430, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();

  // Draw snow
  for (const s of snow) {
    s.y += s.speed;
    s.x += s.drift;
    if (s.y > H + 10) {
      s.y = -10;
      s.x = Math.random() * W;
    }
    if (s.x < 0) s.x = W;
    if (s.x > W) s.x = 0;
    ctx.beginPath();
    ctx.fillStyle = `rgba(255,255,255,${0.4 + s.r * 0.2})`;
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
